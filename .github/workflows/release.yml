name: Release Windows x64

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.0.5
        required: true
        default: v1.0.5
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch" -and $env:REF -ne "refs/heads/main") {
            throw "Manual releases must run from refs/heads/main, not $env:REF."
          }
          & git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release commit $env:GITHUB_SHA is not contained in origin/main."
          }
          $tag = [string]$env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = [string]$env:REF_NAME }
          $tag = $tag.Trim()
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          $version = $tag.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $version" }
          $manifestVersion = [string](Get-Content -LiteralPath "app-manifest.json" -Raw -Encoding UTF8 | ConvertFrom-Json).version
          if ($version -ne $manifestVersion) {
            throw "Release version $version does not match app-manifest.json version $manifestVersion."
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Resolve Artifact Signing policy
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $required = @(
            "ARTIFACT_SIGNING_ENDPOINT",
            "ARTIFACT_SIGNING_ACCOUNT",
            "ARTIFACT_SIGNING_PROFILE",
            "AZURE_TENANT_ID",
            "AZURE_CLIENT_ID",
            "AZURE_CLIENT_SECRET"
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            throw "Public release blocked. Missing trusted signing configuration: $($missing -join ', ')."
          }
          "SIGNING_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SIGNING_STATUS=Authenticode signed and Microsoft Defender scanned." | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Python x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          architecture: x64

      - name: Install build dependencies
        shell: pwsh
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all:
          -r tools/windows-release-requirements.txt

      - name: Run release quality checks
        shell: pwsh
        run: ./tools/check-quality.ps1

      - name: Install Inno Setup 7 x64
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP "innosetup-7.0.2-x64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "Inno Setup 7"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe" -OutFile $download
          $process = Start-Process -FilePath $download -ArgumentList "/CURRENTUSER", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$installDir`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          $compiler = Join-Path $installDir "ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw "ISCC.exe was not installed" }
          "INNO_SETUP_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows x64 application
        shell: pwsh
        run: |
          ./tools/build-windows.ps1 `
            -Version $env:RELEASE_VERSION `
            -OutputDir dist `
            -Stage Application `
            -FeedbackEndpoint '${{ vars.CODEX_FEEDBACK_ENDPOINT }}' `
            -FeedbackTurnstileSiteKey '${{ vars.CODEX_FEEDBACK_TURNSTILE_SITE_KEY }}'

      - name: Sign application PE files
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\build\console-installer\dist\Codex Console
          files-folder-filter: exe,dll,pyd
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify application PE signatures
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          ./tools/check-authenticode-signatures.ps1 `
            -Root "build\console-installer\dist\Codex Console" `
            -Extensions @("exe", "dll", "pyd") `
            -RequiredRelativePaths @("Codex Console.exe", "_internal\tools\NativeFileDrag.exe")

      - name: Build Windows x64 Setup
        shell: pwsh
        run: |
          ./tools/build-windows.ps1 `
            -Version $env:RELEASE_VERSION `
            -OutputDir dist `
            -Stage Installer

      - name: Verify packaged resources and shortcuts
        shell: pwsh
        run: |
          python tools/check-package-resources.py
          python tools/check-clean-install-media.py
          python tools/check-package-footprint.py

      - name: Sign Windows Setup
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\CodexControlConsole-Setup-x64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signed Windows Setup
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          ./tools/check-authenticode-signatures.ps1 `
            -Root dist `
            -Extensions @("exe") `
            -RequiredRelativePaths @("CodexControlConsole-Setup-x64.exe")

      - name: Build signed Windows x64 ZIP
        shell: pwsh
        run: |
          $source = "build\console-installer\dist\Codex Console"
          $archive = "dist\CodexControlConsole-Windows-x64.zip"
          if (-not (Test-Path -LiteralPath "$source\Codex Console.exe" -PathType Leaf)) {
            throw "Signed application folder is incomplete."
          }
          Compress-Archive -LiteralPath $source -DestinationPath $archive -CompressionLevel Optimal -Force
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Windows x64 ZIP was not created."
          }

      - name: Defender scan release artifacts
        shell: pwsh
        run: |
          ./tools/check-defender-artifacts.ps1 -Files @(
            "build\console-installer\dist\Codex Console\Codex Console.exe",
            "build\console-installer\dist\Codex Console\_internal\tools\NativeFileDrag.exe",
            "dist\CodexControlConsole-Setup-x64.exe",
            "dist\CodexControlConsole-Windows-x64.zip"
          )

      - name: Verify release downloads
        shell: pwsh
        run: |
          $expected = @(
            "CodexControlConsole-Setup-x64.exe",
            "CodexControlConsole-Windows-x64.zip"
          )
          $actual = @(Get-ChildItem dist -File | ForEach-Object { $_.Name } | Sort-Object)
          if (($actual -join "`n") -ne (($expected | Sort-Object) -join "`n")) {
            throw "Release files are incorrect: $($actual -join ', ')."
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Codex Console ${{ env.RELEASE_TAG }}
          make_latest: true
          files: |
            dist/CodexControlConsole-Setup-x64.exe
            dist/CodexControlConsole-Windows-x64.zip
          body: |
            ## Windows x64

            Recommended: **CodexControlConsole-Setup-x64.exe** (signed installer, easiest updates).

            Alternative: **CodexControlConsole-Windows-x64.zip** (extract the `Codex Console` folder, then run `Codex Console.exe`; no installer).

            Codex Console v${{ env.RELEASE_VERSION }} for Windows x64.

            Security status: ${{ env.SIGNING_STATUS }}

            1. Double-click the downloaded Setup file.
            2. Choose **Simplified Chinese** or **English**.
            3. On the destination page, choose the drive and install folder.
            4. Finish Setup, then launch **Codex Console** from the desktop or Start menu.

            ## Windows 64 位

            推荐下载：**CodexControlConsole-Setup-x64.exe**（已签名安装包，后续更新最方便）。

            免安装备用：**CodexControlConsole-Windows-x64.zip**（解压 `Codex Console` 文件夹后运行 `Codex Console.exe`）。

            Codex Console v${{ env.RELEASE_VERSION }}，适用于 Windows x64。

            安全状态：${{ env.SIGNING_STATUS }}

            1. 双击下载好的安装程序。
            2. 选择 **简体中文** 或 **English**。
            3. 在安装位置页面选择磁盘和目录。
            4. 完成安装后，从桌面或开始菜单启动 **Codex Console**。
