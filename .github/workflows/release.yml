name: Release Windows x64 Setup

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.0.1
        required: true
        default: v1.0.1
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          $version = $tag.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $version" }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Require Artifact Signing configuration
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $required = @(
            "ARTIFACT_SIGNING_ENDPOINT",
            "ARTIFACT_SIGNING_ACCOUNT",
            "ARTIFACT_SIGNING_PROFILE",
            "AZURE_TENANT_ID",
            "AZURE_CLIENT_ID",
            "AZURE_CLIENT_SECRET"
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            throw "Public release blocked. Missing trusted signing configuration: $($missing -join ', ')"
          }

      - name: Set up Python x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller==6.21.0 pillow==12.3.0 yt-dlp==2026.3.17

      - name: Test feedback and update services
        shell: pwsh
        run: |
          python tools/check-feedback.py
          python tools/check-release-defaults.py
          python tools/check-console-lifecycle.py
          python tools/check-console-update.py
          python tools/check-world-update.py
          python tools/check-clean-uninstall.py
          python tools/check-wallpaper-style.py
          python tools/check-built-in-media-sync.py
          python tools/check-release-security.py
          node --test services/feedback-relay/test/feedback.test.js

      - name: Install Inno Setup 7 x64
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP "innosetup-7.0.2-x64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "Inno Setup 7"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe" -OutFile $download
          $process = Start-Process -FilePath $download -ArgumentList "/CURRENTUSER", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$installDir`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          $compiler = Join-Path $installDir "ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw "ISCC.exe was not installed" }
          "INNO_SETUP_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows x64 application
        shell: pwsh
        run: |
          ./tools/build-windows.ps1 `
            -Version $env:RELEASE_VERSION `
            -OutputDir dist `
            -Stage Application `
            -FeedbackEndpoint '${{ vars.CODEX_FEEDBACK_ENDPOINT }}' `
            -FeedbackTurnstileSiteKey '${{ vars.CODEX_FEEDBACK_TURNSTILE_SITE_KEY }}'

      - name: Sign application PE files
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\build\console-installer\dist\Codex Console
          files-folder-filter: exe,dll,pyd
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify application PE signatures
        shell: pwsh
        run: |
          ./tools/check-authenticode-signatures.ps1 `
            -Root "build\console-installer\dist\Codex Console" `
            -Extensions @("exe", "dll", "pyd") `
            -RequiredRelativePaths @("Codex Console.exe", "_internal\tools\NativeFileDrag.exe")

      - name: Build Windows x64 Setup
        shell: pwsh
        run: |
          ./tools/build-windows.ps1 `
            -Version $env:RELEASE_VERSION `
            -OutputDir dist `
            -Stage Installer

      - name: Verify packaged resources and shortcuts
        shell: pwsh
        run: |
          python tools/check-package-resources.py
          python tools/check-clean-install-media.py

      - name: Sign Windows Setup
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\CodexControlConsole-Setup-x64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signed Windows Setup
        shell: pwsh
        run: |
          ./tools/check-authenticode-signatures.ps1 `
            -Root dist `
            -Extensions @("exe") `
            -RequiredRelativePaths @("CodexControlConsole-Setup-x64.exe")

      - name: Defender scan release artifacts
        shell: pwsh
        run: |
          ./tools/check-defender-artifacts.ps1 -Files @(
            "build\console-installer\dist\Codex Console\Codex Console.exe",
            "build\console-installer\dist\Codex Console\_internal\tools\NativeFileDrag.exe",
            "dist\CodexControlConsole-Setup-x64.exe"
          )

      - name: Verify single download
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "CodexControlConsole-Setup-x64.exe") {
            throw "Release must contain exactly one Windows x64 Setup file."
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Codex Console ${{ env.RELEASE_TAG }}
          make_latest: true
          files: dist/CodexControlConsole-Setup-x64.exe
          body: |
            ## Windows x64

            Download only **CodexControlConsole-Setup-x64.exe**.

            Codex Console v1.0.1 keeps the publisher's current 16-track tiers and ordering, prevents a background or minimized window from losing its local service, and automatically reloads an audio source after a transient service interruption.

            This download is published only after every packaged Windows executable is signed with the same trusted identity, all signatures are verified, and Microsoft Defender accepts the final Setup.

            1. Double-click the downloaded Setup file.
            2. Choose **Simplified Chinese** or **English**.
            3. On the destination page, choose the drive and install folder.
            4. Finish Setup, then launch **Codex Console** from the desktop or Start menu.

            ## Windows 64 位

            只需下载 **CodexControlConsole-Setup-x64.exe**。

            Codex Console v1.0.1 会保留发布者当前的 16 首歌曲分级与顺序；后台或最小化窗口不再误关本地服务，服务短暂中断后播放器也会自动重新载入音频。

            这个下载包只会在所有 Windows 可执行文件均由同一可信身份签名、签名全部验证通过，并且最终安装包通过 Microsoft Defender 扫描后发布。

            1. 双击下载好的安装程序。
            2. 选择 **简体中文** 或 **English**。
            3. 在安装位置页面选择磁盘和目录。
            4. 完成安装后，从桌面或开始菜单启动 **Codex Console**。
