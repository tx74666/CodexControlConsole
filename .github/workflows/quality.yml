name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lightweight project checks
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          architecture: x64

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install lightweight test dependencies
        shell: pwsh
        run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all:
          pillow==12.3.0
          colorama==0.4.6
          qrcode==8.2
          ifaddr==0.2.0
          zeroconf==0.151.5

      - name: Run shared quality checks
        shell: pwsh
        run: ./tools/check-quality.ps1
